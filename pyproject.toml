[project]
name = "showrig"
version = "0.2.0"
description = "An offline procedural film studio: editable FilmCraft timelines and local video exports, controlled from your browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher Davis" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18"]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/tweakyourpc/showrig"

[project.scripts]
showrig = "showrig.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["showrig*"]

[tool.setuptools.package-data]
showrig = ["assets/*", "static/*", "static/fonts/*"]
