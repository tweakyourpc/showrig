<!doctype html>
<meta charset="utf-8">
<title>Showrig demo storyboard</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #070b14; color: #e8eef5; font: 17px/1.55 Inter, system-ui, sans-serif; }
  header { padding: 70px 8vw 30px; }
  h1 { font-size: 54px; margin: 0 0 8px; letter-spacing: -1px; }
  header p { color: #93a4bb; margin: 0; font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; padding: 20px 8vw 120px; }
  .card { border-radius: 16px; background: #0f1828; box-shadow: 0 0 0 1px #1f2c44; overflow: hidden; animation: up .8s both; }
  .card:nth-child(3n+2) { animation-delay: .1s } .card:nth-child(3n) { animation-delay: .2s }
  .thumb { aspect-ratio: 16/9; position: relative; overflow: hidden; }
  .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, #ffffff22 50%, transparent 70%); animation: sheen 3.5s infinite; }
  .card div.t { padding: 16px 18px 20px; }
  .card b { display: block; font-size: 19px; } .card span { color: #93a4bb; font-size: 15px; }
  .tag { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 99px; font-size: 13px; background: #46d9b022; color: #46d9b0; }
  @keyframes up { from { opacity: 0; transform: translateY(30px) } }
  @keyframes sheen { from { transform: translateX(-100%) } to { transform: translateX(100%) } }
</style>
<header><h1>Launch film · storyboard</h1><p>Seven shots, signed off. Everything after this is procedural.</p></header>
<section class="grid" id="grid"></section>
<script>
const shots = [
  ['Intro', 'Blender arc of every screen', 'blender', 'linear-gradient(135deg,#3fd6e0,#142238)'],
  ['The problem', 'Card · narration 2 lines', 'effectcraft', 'linear-gradient(135deg,#8b5cf6,#0f1828)'],
  ['Terminal', 'Capture · typing on screen', 'playwright', 'linear-gradient(135deg,#46d9b0,#0c1220)'],
  ['Storyboard', 'Capture · eased scroll', 'playwright', 'linear-gradient(135deg,#ff5fae,#1a1030)'],
  ['Voice', 'Kokoro on the GPU', 'kokoro', 'linear-gradient(135deg,#f5a524,#201608)'],
  ['Score', 'Synthesized to the cut', 'numpy', 'linear-gradient(135deg,#6ea8ff,#0b1426)'],
  ['Edit', 'FilmCraft timeline, 6 tracks', 'filmcraft', 'linear-gradient(135deg,#c3e88d,#101a0a)'],
  ['Credits', 'Post module, any time', 'effectcraft', 'linear-gradient(135deg,#ff7a59,#200c06)'],
  ['Outro', 'Wall of screens', 'blender', 'linear-gradient(135deg,#3fd6e0,#8b5cf6)'],
];
document.getElementById('grid').innerHTML = shots.map(([t, d, tag, bg], i) =>
  `<article class="card"><div class="thumb" style="background:${bg}"></div><div class="t"><b>${i + 1}. ${t}</b><span>${d}</span><br><em class="tag">${tag}</em></div></article>`).join('');
</script>
